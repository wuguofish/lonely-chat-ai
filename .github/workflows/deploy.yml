name: 部署網站

on:
  push:
    branches: [ main ]  # 當推送到 main 分支時觸發

permissions:
  contents: write # 部署要寫入 gh-pages 分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      # 網站是純靜態檔，沒有建置步驟；只挑出要上線的檔案
      - name: 整理要上線的檔案
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude README.md --exclude _site ./ _site/

      - name: 部署 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site # 要上線的資料夾
          branch: gh-pages # 部署到哪個分支
